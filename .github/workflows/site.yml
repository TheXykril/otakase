name: Site

# Publishes site/ to Cloudflare (the "otakase" Worker, which serves
# otakase.com through its static assets) and to GitHub Pages. The
# Cloudflare step needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets and is skipped while they are missing. GitHub Pages must be set to
# deploy from "GitHub Actions" in the repository settings.
# Runs by itself at the end of Build and release (when it publishes a
# release, so the changelog shows the new version) and of Wiki sync (so the
# help pages match the wiki). It can still be started by hand from the
# Actions tab.
#
# Two kinds of build:
# - Quick (default): text only. Rebuilds the help pages, the changelog and
#   the page files, and reuses the app screens and the Try demo from the
#   last full build. Takes a minute or two.
# - Full ("full" ticked): also renders the app screens and builds the Try
#   demo from the app. Use it after app UI changes. Build and release always
#   does a full build.
# A quick build turns into a full one when there is no earlier full build to
# reuse (the saved parts are dropped after 7 days without a site build).
on:
  workflow_dispatch:
    inputs:
      full:
        description: Full build (app screens and Try demo too, for app UI changes)
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      # The app screens and the Try demo from the last full build. The
      # screens in the repository are cleared first so only that build's set
      # is used, as a full build does.
      - name: Clear old screens
        if: ${{ !inputs.full }}
        run: rm -f site/img/shots/*.webp

      - name: Reuse app screens and demo
        id: parts
        if: ${{ !inputs.full }}
        uses: actions/cache/restore@v4
        with:
          path: |
            site/demo
            site/img/shots
          key: site-app-parts-${{ github.sha }}
          restore-keys: site-app-parts-

      - name: Pick build kind
        id: kind
        env:
          WANT_FULL: ${{ inputs.full }}
          REUSED: ${{ steps.parts.outputs.cache-matched-key }}
        run: |
          if [ "$WANT_FULL" = true ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Full build" >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$REUSED" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "Full build: no earlier app screens and demo to reuse" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Quick build: app screens and demo reused from $REUSED" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The app screens on the site are rendered from the app's own widgets
      # (app/test/site_screens_test.dart), so they always match the app at
      # this commit. Show art comes from app/test/fixtures/site; nothing is
      # downloaded.
      - uses: subosito/flutter-action@v2
        if: steps.kind.outputs.full == 'true'
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Render app screens
        if: steps.kind.outputs.full == 'true'
        working-directory: app
        run: |
          flutter pub get
          flutter test test/site_screens_test.dart --update-goldens \
            --dart-define=SITE_SHOTS="$RUNNER_TEMP/shots"

      # Refresh the package index first: the runner image's copy goes stale
      # and installs then fail with 404s. ffmpeg and Pillow are only needed
      # for the app screens and the demo.
      - name: Install ffmpeg, Pillow and Markdown
        env:
          FULL: ${{ steps.kind.outputs.full }}
        run: |
          pkgs=python3-markdown
          [ "$FULL" = true ] && pkgs="$pkgs ffmpeg python3-pil"
          sudo apt-get update -qq
          sudo apt-get install -y -qq $pkgs > /dev/null

      # Help pages (wiki/) and the changelog (CHANGELOG.md) live on the site,
      # so nothing on it links to the repository.
      - name: Build help pages and changelog
        run: python3 .github/site_pages.py site

      # "Try it here" on the site is the app itself, built for the web with
      # the same sample shows (app/demo). Its player plays a generated clip.
      - name: Build the live demo
        if: steps.kind.outputs.full == 'true'
        working-directory: app
        run: |
          demo/build.sh ../site/demo

      - name: Use the new screens
        if: steps.kind.outputs.full == 'true'
        run: |
          rm -f site/img/shots/*.webp
          python3 - "$RUNNER_TEMP/shots" site/img/shots <<'PY'
          import pathlib, sys
          from PIL import Image
          src, dst = map(pathlib.Path, sys.argv[1:])
          for png in sorted(src.glob('*.png')):
              Image.open(png).convert('RGB').save(dst / f'{png.stem}.webp', 'WEBP', quality=80, method=6)
          PY

      # Kept for the next quick builds.
      - name: Save app screens and demo
        if: steps.kind.outputs.full == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            site/demo
            site/img/shots
          key: site-app-parts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: List the screens
        run: |
          ids=$(python3 -c "import json; print(', '.join(str(s['id']) for s in json.load(open('app/test/fixtures/site/shows.json'))))")
          sed -i "s/const SHOTS = \[.*\];/const SHOTS = [$ids];/" site/app.js
          ls site/img/shots

      # Browsers keep app.js and style.css for hours, so each deploy gives
      # them a new address and a reload always gets the matching files.
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html site/try/index.html site/help/*.html site/changelog/index.html

      # Cloudflare first, so a slow GitHub Pages deploy cannot hold it up.
      # Assets only, no script. The otakase.com/* route is set in the
      # Cloudflare dashboard, and the /download and /app-login Workers keep
      # their own, more specific routes.
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --name otakase --assets site --compatibility-date 2026-11-01

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
