name: Site

# Publishes site/ to Cloudflare (the "otakase" Worker, which serves
# otakase.xyverion.com through its static assets) and to GitHub Pages. The
# Cloudflare step needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# secrets and is skipped while they are missing. GitHub Pages must be set to
# deploy from "GitHub Actions" in the repository settings.
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and is skipped while
# they are missing. GitHub Pages must be set to deploy from "GitHub Actions"
# in the repository settings.
# Runs by itself at the end of Build and release (when it publishes a
# release, so the changelog shows the new version) and of Wiki sync (so the
# help pages match the wiki). It can still be started by hand from the
# Actions tab.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CLOUDFLARE_READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      # The app screens on the site are rendered from the app's own widgets
      # (app/test/site_screens_test.dart), so they always match the app at
      # this commit. Show art comes from app/test/fixtures/site; nothing is
      # downloaded.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Render app screens
        working-directory: app
        run: |
          flutter pub get
          flutter test test/site_screens_test.dart --update-goldens \
            --dart-define=SITE_SHOTS="$RUNNER_TEMP/shots"

      # Refresh the package index first: the runner image's copy goes stale
      # and installs then fail with 404s.
      - name: Install ffmpeg, Pillow and Markdown
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg python3-pil python3-markdown > /dev/null

      # Help pages (wiki/) and the changelog (CHANGELOG.md) live on the site,
      # so nothing on it links to the repository.
      - name: Build help pages and changelog
        run: python3 .github/site_pages.py site

      # "Try it here" on the site is the app itself, built for the web with
      # the same sample shows (app/demo). Its player plays a generated clip.
      - name: Build the live demo
        working-directory: app
        run: |
          demo/build.sh ../site/demo

      - name: Use the new screens
        run: |
          rm -f site/img/shots/*.webp
          python3 - "$RUNNER_TEMP/shots" site/img/shots <<'PY'
          import pathlib, sys
          from PIL import Image
          src, dst = map(pathlib.Path, sys.argv[1:])
          for png in sorted(src.glob('*.png')):
              Image.open(png).convert('RGB').save(dst / f'{png.stem}.webp', 'WEBP', quality=80, method=6)
          PY
          ids=$(python3 -c "import json; print(', '.join(str(s['id']) for s in json.load(open('app/test/fixtures/site/shows.json'))))")
          sed -i "s/const SHOTS = \[.*\];/const SHOTS = [$ids];/" site/app.js
          ls site/img/shots

      # Browsers keep app.js and style.css for hours, so each deploy gives
      # them a new address and a reload always gets the matching files.
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html site/try/index.html site/help/*.html site/changelog/index.html

      # Cloudflare first, so a slow GitHub Pages deploy cannot hold it up.
      # Assets only, no script. The otakase.xyverion.com/* route is set in the
      # Cloudflare dashboard, and the /download and /app-login Workers keep
      # their own, more specific routes.
      - name: Publish to Cloudflare
        if: env.CLOUDFLARE_READY == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --name otakase --assets site --compatibility-date 2026-11-01

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
