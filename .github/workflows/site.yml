name: Site

# Publishes site/ to GitHub Pages. Pages must be set to deploy from
# "GitHub Actions" in the repository settings.
# Runs only when started by hand (Actions tab or the bot's /github command).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v5

      # The app screens on the site are rendered from the app's own widgets
      # (app/test/site_screens_test.dart), so they always match the app at
      # this commit. Show art comes from app/test/fixtures/site; nothing is
      # downloaded.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Render app screens
        working-directory: app
        run: |
          flutter pub get
          flutter test test/site_screens_test.dart --update-goldens \
            --dart-define=SITE_SHOTS="$RUNNER_TEMP/shots"

      # The "Look around" tour walks the app the same way: every screen it
      # can reach from Home, per device, with where each button sits.
      - name: Render the app tour
        working-directory: app
        run: |
          flutter test test/site_tour_test.dart --update-goldens \
            --dart-define=SITE_TOUR="$RUNNER_TEMP/tour"

      - name: Use the new screens
        run: |
          sudo apt-get install -y -qq python3-pil > /dev/null
          rm -f site/img/shots/*.webp
          python3 - "$RUNNER_TEMP/shots" site/img/shots <<'PY'
          import pathlib, sys
          from PIL import Image
          src, dst = map(pathlib.Path, sys.argv[1:])
          for png in sorted(src.glob('*.png')):
              Image.open(png).convert('RGB').save(dst / f'{png.stem}.webp', 'WEBP', quality=80, method=6)
          PY
          python3 - "$RUNNER_TEMP/tour" site/tour <<'PY'
          import pathlib, shutil, sys
          from PIL import Image
          src, dst = map(pathlib.Path, sys.argv[1:])
          shutil.rmtree(dst, ignore_errors=True)
          for png in sorted(src.rglob('*.png')):
              out = dst / png.relative_to(src).with_suffix('.webp')
              out.parent.mkdir(parents=True, exist_ok=True)
              Image.open(png).convert('RGB').save(out, 'WEBP', quality=78, method=6)
          shutil.copy(src / 'tour.json', dst / 'tour.json')
          PY
          ids=$(python3 -c "import json; print(', '.join(str(s['id']) for s in json.load(open('app/test/fixtures/site/shows.json'))))")
          sed -i "s/const SHOTS = \[.*\];/const SHOTS = [$ids];/" site/app.js
          ls site/img/shots
          du -sh site/tour

      # Browsers keep app.js and style.css for hours, so each deploy gives
      # them a new address and a reload always gets the matching files.
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" site/index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
