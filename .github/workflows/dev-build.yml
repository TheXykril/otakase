name: Dev Build

# Publishes what is on main as the "dev" pre-release, for trying unreleased
# work before a real release is cut: the app for Windows, macOS, Linux and
# Android, plus the command-line binaries. Run it by hand from the Actions tab.
# The app reads the version from the release title, so keep it
# "Otakase <version>".
#
# The release is marked pre-release and never "latest", so the in-app update
# check ignores it unless DevBuilds=true. Each run
# replaces the previous dev release and moves the "dev" tag; the tag does not
# start with "v", so the release job's changelog range skips it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version the dev build is heading to (shown as <version>-dev.<run number>)"
        required: true
        default: "26.1.0"
        type: string

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          BASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 26.1.0, got '$BASE_VERSION'" >&2
            exit 1
          fi
          # The run number only goes up, so a newer dev build can be told
          # from an older one.
          echo "version=${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  # The desktop app, one runner per OS (Flutter cannot cross-compile it).
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
          - os: macos
            runner: macos-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      OTAKASE_VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Linux build tools
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libmpv-dev patchelf

      - name: Build
        working-directory: app
        run: scripts/build-desktop.sh release

      - name: Package
        working-directory: app
        run: scripts/package-desktop.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dev-app-${{ matrix.os }}
          path: app/build/desktop-release/otakase-app-*
          retention-days: 3
          if-no-files-found: error

  # The Android app, signed with the release key so it updates an installed
  # copy (this workflow only ever builds main).
  android:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OTAKASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is signed with the debug key"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/otakase-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/otakase-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties

      - name: Build APK
        run: |
          app/scripts/build-apk.sh
          mkdir -p release
          cp app/build/app/outputs/flutter-apk/app-release.apk release/otakase-android.apk

      - name: Remove signing key
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/otakase-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: dev-android
          path: release/otakase-android.apk
          retention-days: 3
          if-no-files-found: error

  dev-build:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # History back to the last release commit, for the Discord post.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -short ./...

      - name: Set dev version
        env:
          DEV_VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The Build/ scripts read VERSION.txt; this change stays in the runner.
          # The update check (DevBuilds=true) compares these versions.
          echo "$DEV_VERSION" > VERSION.txt
          echo "DEV_VERSION=$DEV_VERSION" >> "$GITHUB_ENV"

      - name: Build binaries
        run: |
          ./Build/buildlinux
          ./Build/buildmac-x86_64
          ./Build/buildmac-arm64
          ./Build/buildwindows-x86_64
          mkdir -p dist
          mv otakase-linux-x86_64 otakase-linux-arm64 otakase-macos-x86_64 otakase-macos-arm64 otakase-windows-x86_64.exe dist/

      - uses: actions/download-artifact@v8
        with:
          pattern: dev-*
          path: dist
          merge-multiple: true

      # The update metadata belongs to real releases; the dev release only
      # offers the files.
      - name: Drop app update metadata
        run: rm -f dist/*.json && ls -l dist

      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          cat > notes.md <<EOF
          Development build of \`main\` at ${GITHUB_SHA::7}, version \`$DEV_VERSION\`.

          Not a release: it can be broken, and it is replaced by the next dev build. The app offers it only with \`DevBuilds=true\` in the config.

          The app: \`otakase-app-windows-setup.exe\` (Windows), \`otakase-app-macos.zip\` (macOS, unsigned), \`otakase-app-linux-x86_64.AppImage\` (Linux) and \`otakase-android.apk\` (phone and Android TV).

          Command line (being retired): the Windows one is the bare \`.exe\` without the installer, so it needs \`mpv\` on your PATH.
          EOF
          gh release create dev dist/* \
            --target "$GITHUB_SHA" \
            --title "Otakase $DEV_VERSION" \
            --notes-file notes.md \
            --prerelease \
            --latest=false

      # Announces the build in the Discord server's test-builds channel, sent by
      # the Otakase bot. Needs a DISCORD_BOT_TOKEN secret; without it this does
      # nothing. A header that fails to render leaves the post without one.
      - name: Render the Discord header
        if: env.DISCORD_BOT_TOKEN != ''
        continue-on-error: true
        run: |
          python3 .github/discord/post_release.py render-dev "$DEV_VERSION" "$RUNNER_TEMP/header.html"
          npx -y playwright@1.56.1 screenshot --channel chrome --viewport-size 1600,400 \
            --wait-for-timeout 3000 "file://$RUNNER_TEMP/header.html" "$RUNNER_TEMP/header.png"

      - name: Post to Discord
        if: env.DISCORD_BOT_TOKEN != ''
        env:
          # The test-builds channel (found by name in the server), and the
          # "Tester" role each post pings (empty for no ping).
          DISCORD_GUILD: "1556588123561922560"
          DISCORD_DEV_CHANNEL: "test-builds"
          DISCORD_DEV_ROLE: "1556589751077699664"
        run: python3 .github/discord/post_release.py post-dev "$DEV_VERSION" "$RUNNER_TEMP/header.png"
