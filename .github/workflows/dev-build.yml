name: Dev Build

# Publishes what is on main as the "dev" pre-release, for trying unreleased
# work before a real release is cut. Run it by hand from the Actions tab.
# It builds the same files as a release (app-build.yml): the Android APK and
# the desktop app for Windows, macOS and Linux.
#
# The release is marked pre-release and never "latest", so the apps' update
# checks never offer it; install it by hand. Each run replaces the previous
# dev release and moves the "dev" tag; the tag does not start with "v", so
# the release job's changelog range skips it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version the dev build is heading to (shown as <version>-dev.<run number>)"
        required: true
        default: "26.8.0"
        type: string

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Dev version
        id: version
        env:
          BASE_VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 26.8.0, got '$BASE_VERSION'" >&2
            exit 1
          fi
          echo "version=${BASE_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    permissions:
      contents: read
    uses: ./.github/workflows/app-build.yml
    with:
      ref: ${{ github.sha }}
      version: ${{ needs.version.outputs.version }}
      signed: true
    secrets: inherit

  dev-build:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DEV_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # History back to the last release commit, for the Discord post.
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: otakase-android
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: otakase-app-*
          path: dist
          merge-multiple: true

      - name: Replace the dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          cat > notes.md <<EOF
          Development build of \`main\` at ${GITHUB_SHA::7}, version \`$DEV_VERSION\`.

          Not a release: it can be broken, and it is replaced by the next dev build. The apps never offer it as an update; install it by hand.
          EOF
          gh release create dev dist/otakase-android.apk dist/otakase-app-windows-setup.exe \
            dist/otakase-app-macos.zip dist/otakase-app-linux-x86_64.AppImage \
            --target "$GITHUB_SHA" \
            --title "Otakase $DEV_VERSION" \
            --notes-file notes.md \
            --prerelease \
            --latest=false

      # Announces the build in the Discord server's test-builds channel, sent by
      # the Otakase bot. Needs a DISCORD_BOT_TOKEN secret; without it this does
      # nothing. A header that fails to render leaves the post without one.
      - name: Render the Discord header
        if: env.DISCORD_BOT_TOKEN != ''
        continue-on-error: true
        run: |
          python3 .github/discord/post_release.py render-dev "$DEV_VERSION" "$RUNNER_TEMP/header.html"
          npx -y playwright@1.56.1 screenshot --channel chrome --viewport-size 1600,400 \
            --wait-for-timeout 3000 "file://$RUNNER_TEMP/header.html" "$RUNNER_TEMP/header.png"

      - name: Post to Discord
        if: env.DISCORD_BOT_TOKEN != ''
        env:
          # The test-builds channel (found by name in the server), and the
          # "Tester" role each post pings (empty for no ping).
          DISCORD_GUILD: "1556588123561922560"
          DISCORD_DEV_CHANNEL: "test-builds"
          DISCORD_DEV_ROLE: "1556589751077699664"
        run: python3 .github/discord/post_release.py post-dev "$DEV_VERSION" "$RUNNER_TEMP/header.png"
