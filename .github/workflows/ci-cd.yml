name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Trigger on pushes to the main branch
  pull_request:
    branches:
      - main # Trigger on pull requests targeting the main branch
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    # No permissions at all, not even read: this job can run an untrusted
    # PR's own code (the pull_request event, or workflow_dispatch's pr_number
    # input), and the repo is public, so actions/checkout below fetches over
    # anonymous HTTPS without needing a token. contents: read was never load
    # bearing here -- nothing in this job pushes, comments, or reads through
    # the API -- it just handed a real token to code this job cannot trust.
    permissions: {}
    env:
      # A release commit is the only one that needs the macOS and Windows
      # targets; the same marker the release job below keys off.
      RELEASE_BUILD: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release:') }}

    steps:
      - name: Validate pr_number input
        # workflow_dispatch lets a maintainer point this run at an arbitrary
        # PR; keep that input to a plain integer before it reaches a `ref:`.
        if: github.event.inputs.pr_number != ''
        env:
          PR_NUMBER: ${{ github.event.inputs.pr_number }}
        run: |
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::pr_number must be a positive integer, got: $PR_NUMBER"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history and tags
          ref: ${{ github.event.pull_request.head.sha || (github.event.inputs.pr_number && format('refs/pull/{0}/head', github.event.inputs.pr_number)) || github.sha }}
          # No token to persist: this checkout can hold untrusted PR code,
          # and a persisted credential is exactly what that code would go
          # looking for. The job has none anyway (permissions: {} above),
          # but this also blocks the plain git CLI here from picking one up.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          # Deps are vendored (go.sum-based module caching gains nothing) and
          # this job can run untrusted PR code via the pr_number dispatch
          # input above; skip the actions cache so that code can't poison a
          # cache entry a later default-branch run would trust.
          cache: false

      - name: Install Dependencies
        run: go mod tidy

      - name: Vet
        run: go vet ./...

      - name: Test
        # -short skips the live provider tests, which depend on third-party hosts
        # being up and so cannot gate a build.
        run: go test -short -race ./...

      - name: Build Linux binary
        run: |
          ./Build/buildlinux
          mkdir -p release/linux
          mv otakase-linux-x86_64 release/linux/
          mv otakase-linux-arm64 release/linux/
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMPRESS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release:') }}

      # Everything below this point builds platforms only a release needs.
      #
      # otakase is a Linux desktop tool, so a Linux build is what actually gates a
      # change. Cross-compiling the macOS and Windows targets on every push cost
      # several minutes each time and proved nothing nobody was waiting on, so
      # they are keyed off the same "release:" marker the release job uses. An
      # ordinary push proves the code with vet, the test suite and a Linux build;
      # the full set of assets is produced when a release is actually being cut.
      #
      # These are Go cross-compiles running on this ubuntu-latest job. They do
      # not start a macOS runner, and never did.
      - name: Build macOS x86_64 binary
        if: env.RELEASE_BUILD == 'true'
        run: |
          ./Build/buildmac-x86_64

      - name: Build macOS ARM64 binary
        if: env.RELEASE_BUILD == 'true'
        run: |
          ./Build/buildmac-arm64

      - name: Install LLVM
        if: env.RELEASE_BUILD == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y llvm
          # Find the llvm-lipo command
          LIPO_CMD=$(find /usr/bin -name "llvm-lipo*" | head -n 1)
          echo "Found lipo command: $LIPO_CMD"
          echo "LIPO_CMD=$LIPO_CMD" >> $GITHUB_ENV

      - name: Create Universal macOS binary
        if: env.RELEASE_BUILD == 'true'
        run: |
          ${{ env.LIPO_CMD }} -create "otakase-macos-x86_64" "otakase-macos-arm64" -output "otakase-macos-universal"
          mkdir -p release/macos
          mv otakase-macos-x86_64 release/macos
          mv otakase-macos-arm64 release/macos
          mv otakase-macos-universal release/macos

      - name: Build Windows binary (cross-compile)
        if: env.RELEASE_BUILD == 'true'
        run: |
          ./Build/buildwindows
          mkdir -p release/windows
          mv otakase-windows-x86_64.exe release/windows/otakase-windows-x86_64.exe
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_EVENT_HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMPRESS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'release:') }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: otakase-binaries
          # release/macos and release/windows only exist on a release build; the
          # glob tolerates their absence, and the release job needs them all.
          path: |
            release/linux/otakase-linux-x86_64
            release/linux/otakase-linux-arm64
            release/macos/otakase-macos-*
            release/windows/otakase-windows-x86_64.exe
          retention-days: 1
          if-no-files-found: warn

  release:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.organize.outputs.version }}
    if: |
      github.ref == 'refs/heads/main' && 
      github.event_name == 'push' && 
      (contains(github.event.head_commit.message, 'release:'))

    steps:
      # No ref: here defaults to checking out the branch tip (github.ref) at
      # whatever commit main happens to be on when this step runs -- not the
      # commit that triggered the workflow. This job waits on `build`, which
      # can run long (the Linux binaries are UPX --ultra-brute compressed on a
      # release build, which alone can take the better part of an hour), so a
      # second push landing on main during that wait moved the tag: v2.0.1 was
      # cut from the commit main had reached by the time this ran, not the one
      # whose message said "release:". Pin it to that commit explicitly.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Checkout MPV binaries
        uses: actions/checkout@v7
        with:
          ref: mpv-binaries
          path: mpv-temp
          sparse-checkout: |
            Build/mpv.exe.gz
            Build/mpv.zip

      - name: Setup MPV binary
        run: |
          New-Item -ItemType Directory -Force -Path "Build\mpv"
          if (Test-Path "mpv-temp/Build/mpv.exe.gz") {
            Copy-Item "mpv-temp/Build/mpv.exe.gz" "Build\mpv\mpv.exe.gz"
            7z x "Build\mpv\mpv.exe.gz" -o"Build\mpv"
            Remove-Item "Build\mpv\mpv.exe.gz"
          } else {
            Write-Host "Warning: MPV binary not found in mpv-binaries branch, downloading from URL..."
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/${{ github.repository }}/main/Build/mpv.exe.gz" -OutFile "Build\mpv\mpv.exe.gz"
            7z x "Build\mpv\mpv.exe.gz" -o"Build\mpv"
            Remove-Item "Build\mpv\mpv.exe.gz"
          }
          Remove-Item -Recurse -Force "mpv-temp" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: otakase-binaries
          path: Build

      - name: Organize Release Files
        id: organize
        run: |
          $version = Get-Content VERSION.txt
          echo "OTAKASE_VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT
          $release_dir = "releases/otakase-$version"

          # Create directory structure
          New-Item -ItemType Directory -Force -Path "$release_dir/windows"
          New-Item -ItemType Directory -Force -Path "$release_dir/macos"
          New-Item -ItemType Directory -Force -Path "$release_dir/linux"

          # List contents of Build directory to debug
          Write-Host "Contents of Build directory:"
          Get-ChildItem -Path "Build" -Recurse

          # Move files to their respective directories
          Move-Item "Build/windows/otakase-windows-x86_64.exe" "$release_dir/windows/"
          Move-Item "Build/macos/otakase-macos-universal" "$release_dir/macos/"
          Move-Item "Build/macos/otakase-macos-x86_64" "$release_dir/macos/"
          Move-Item "Build/macos/otakase-macos-arm64" "$release_dir/macos/"
          Move-Item "Build/linux/otakase-linux-x86_64" "$release_dir/linux/"
          Move-Item "Build/linux/otakase-linux-arm64" "$release_dir/linux/"
          Copy-Item "Build/mpv/mpv.exe" "$release_dir/windows/"
        shell: pwsh

      - name: Update Inno Setup Script with New Version
        run: |
          $iss_path = "Build/otakase-windows-build.iss"
          $content = Get-Content $iss_path
          $content = $content -replace '^AppVersion=.*', "AppVersion=$env:OTAKASE_VERSION"
          Set-Content $iss_path $content
        shell: pwsh

      - name: Create Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "Build\otakase-windows-build.iss"
        shell: pwsh

      # The app icon in every size and format, for anyone packaging or
      # theming otakase.
      - name: Pack icons
        run: |
          $pack = "Build/Output/otakase-icons"
          New-Item -ItemType Directory -Force -Path "$pack/png" | Out-Null
          Copy-Item "Build/app-icon/png/*.png" "$pack/png/"
          Copy-Item "internal/appicon/otakase.svg", "Build/app-icon/otakase.ico", "Build/app-icon/otakase.icns" "$pack/"
          Compress-Archive -Path "$pack/*" -DestinationPath "Build/Output/otakase-icons.zip" -Force
        shell: pwsh

      - name: Build direct commit release notes
        run: |
          $ErrorActionPreference = 'Stop'

          $repo = "${{ github.repository }}"
          $token = "${{ secrets.GITHUB_TOKEN }}"
          $headers = @{
            Authorization = "Bearer $token"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }

          $currentTag = "v$env:OTAKASE_VERSION"
          $tags = @(git tag -l "v*" --sort=-version:refname)
          $previousTag = $null
          foreach ($tag in $tags) {
            if ($tag -ne $currentTag) {
              $previousTag = $tag
              break
            }
          }

          if ($previousTag) {
            $range = "$previousTag..HEAD"
          } else {
            $rootCommit = (git rev-list --max-parents=0 HEAD | Select-Object -First 1)
            if ([string]::IsNullOrWhiteSpace($rootCommit)) {
              $range = "HEAD"
            } else {
              $range = "$rootCommit..HEAD"
            }
          }

          $rawCommits = @(git log --no-merges --pretty=format:'%H%x09%s%x09%an' $range)
          if ($rawCommits.Count -eq 1 -and [string]::IsNullOrWhiteSpace($rawCommits[0])) {
            $rawCommits = @()
          }

          $feats = @()
          $fixes = @()
          $chores = @()
          $others = @()
          $contributorSet = @{}

          foreach ($entry in $rawCommits) {
            $parts = $entry -split "`t", 3
            if ($parts.Count -lt 3) {
              continue
            }

            $sha = $parts[0].Trim()
            $subject = $parts[1].Trim()
            $authorName = $parts[2].Trim()

            if ([string]::IsNullOrWhiteSpace($sha) -or [string]::IsNullOrWhiteSpace($subject)) {
              continue
            }

            if ($subject -match '^\s*release:') {
              continue
            }

            $pullsUri = "https://api.github.com/repos/$repo/commits/$sha/pulls"
            $pulls = @()
            try {
              # An empty JSON array comes back as $null, and @($null) is an array
              # of one -- so without filtering, "no pull requests" reads as "one
              # pull request" and every commit is skipped.
              $pulls = @(Invoke-RestMethod -Uri $pullsUri -Headers $headers -Method Get | Where-Object { $_ })
            } catch {
              $pulls = @()
            }

            # Skip commits that are already represented by pull requests in generated notes.
            if ($pulls.Count -gt 0) {
              continue
            }

            $commitUri = "https://api.github.com/repos/$repo/commits/$sha"
            $login = $null
            try {
              $commitData = Invoke-RestMethod -Uri $commitUri -Headers $headers -Method Get
              if ($null -ne $commitData.author -and $null -ne $commitData.author.login) {
                $login = $commitData.author.login
              }
            } catch {
              # Falling back here prints the historical git author name, which
              # for renamed accounts is the old one -- so say it out loud
              # rather than quietly publishing a stale name.
              Write-Warning "Could not resolve the GitHub account for $sha; using the commit's author name."
              $login = $null
            }

            $shortSha = $sha.Substring(0, 7)
            if (-not [string]::IsNullOrWhiteSpace($login)) {
              $authorDisplay = "[@$login](https://github.com/$login)"
            } else {
              $authorDisplay = $authorName
            }

            $contributorSet[$authorDisplay] = $true
            $commitLine = "- $subject ([$shortSha](https://github.com/$repo/commit/$sha)) by $authorDisplay"

            if ($subject -match '^(?i)(feat|add)') {
              $feats += $commitLine
            } elseif ($subject -match '^(?i)(fix|bug|hotfix)') {
              $fixes += $commitLine
            } elseif ($subject -match '^(?i)(chore|clean|update|refactor|docs|style|test|ver)') {
              $chores += $commitLine
            } else {
              $others += $commitLine
            }
          }

          $notesPath = "Build/release-notes-extra.md"

          # The banner heads every release. It is read from the tag, so an
          # old release keeps the banner it shipped with.
          $banner = "![Otakase](https://raw.githubusercontent.com/$repo/v$env:OTAKASE_VERSION/site/img/release-banner.png)"

          $body = @()
          $body += $banner
          $body += ""
          $body += "## 📝 Changelog"
          $body += ""

          if ($feats.Count -gt 0) {
            $body += "### 🚀 Features"
            $body += $feats
            $body += ""
          }
          if ($fixes.Count -gt 0) {
            $body += "### 🐛 Bug Fixes"
            $body += $fixes
            $body += ""
          }
          if ($chores.Count -gt 0) {
            $body += "### 🔧 Maintenance & Improvements"
            $body += $chores
            $body += ""
          }
          if ($others.Count -gt 0) {
            $body += "### 📝 Other Changes"
            $body += $others
            $body += ""
          }

          # A release made only of pull requests is fully covered by GitHub's
          # generated notes (with their own Full Changelog link), so leave the
          # extra block out instead of printing empty sections.
          if ($feats.Count -eq 0 -and $fixes.Count -eq 0 -and $chores.Count -eq 0 -and $others.Count -eq 0) {
            Set-Content -Path $notesPath -Value $banner -Encoding utf8
            return
          }

          $body += "## 🤝 Contributors"
          $contributors = @($contributorSet.Keys | Sort-Object)
          $body += "- " + ($contributors -join ", ")

          if ($previousTag) {
            $body += ""
            $body += "---"
            $body += "_Diff range: [$previousTag..v$env:OTAKASE_VERSION](https://github.com/$repo/compare/$previousTag...v$env:OTAKASE_VERSION)_"
          }

          $body | Set-Content -Path $notesPath -Encoding utf8
        shell: pwsh

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "v${{ env.OTAKASE_VERSION }}"
          name: "Otakase v${{ env.OTAKASE_VERSION }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: Build/release-notes-extra.md
          files: |
            releases/otakase-${{ env.OTAKASE_VERSION }}/linux/otakase-linux-x86_64
            releases/otakase-${{ env.OTAKASE_VERSION }}/linux/otakase-linux-arm64
            releases/otakase-${{ env.OTAKASE_VERSION }}/macos/otakase-macos-x86_64
            releases/otakase-${{ env.OTAKASE_VERSION }}/macos/otakase-macos-arm64
            releases/otakase-${{ env.OTAKASE_VERSION }}/macos/otakase-macos-universal
            releases/otakase-${{ env.OTAKASE_VERSION }}/windows/otakase-windows-x86_64.exe
            Build/Output/otakase-windows-installer.exe
            Build/Output/otakase-icons.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Submits the new installer to winget. A release published with
  # GITHUB_TOKEN starts no other workflow, so it is called from here rather
  # than on a `release: published` trigger.
  winget:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/winget.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # Merges a Dependabot PR once the build above passes. It lives in this
  # workflow rather than its own so `needs: build` does the waiting: no repo
  # auto-merge setting or required status check has to exist for a red build
  # to stay unmerged. Major Go module bumps are left for a human; major Actions
  # bumps merge too, since they only touch CI. Merging never
  # releases anything; the release job only runs for a `release:` commit.
  dependabot-merge:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'TheXykril/otakase'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major' || steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge "$PR_URL" --squash --delete-branch
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
