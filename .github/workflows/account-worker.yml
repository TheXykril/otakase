name: Deploy account Worker

# Tests and deploys the Otakase account Worker (worker/account) to
# Cloudflare. Manual only.
#
# Needs secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit,
# Workers Routes: Edit, DNS: Edit for the account.otakase.com custom domain)
# and CLOUDFLARE_ACCOUNT_ID. Repository variables ACCOUNT_DISCORD_CLIENT_ID
# and ACCOUNT_GOOGLE_CLIENT_ID name the sign-in apps; ACCOUNT_D1_ID,
# ACCOUNT_TURNSTILE_SITE_KEY and ACCOUNT_BOT_URL replace the values in
# wrangler.jsonc when set. Worker secrets are set once with
# `wrangler secret put`, never here.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply new database migrations first
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: account-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker/account
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/account/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check settings
        env:
          D1_ID: ${{ vars.ACCOUNT_D1_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets first."
            exit 1
          fi
          if [ -n "$D1_ID" ]; then
            sed -i -E "s/\"database_id\": \"[^\"]*\"/\"database_id\": \"$D1_ID\"/" wrangler.jsonc
          fi

      - name: Apply database migrations
        if: inputs.migrate
        run: npx wrangler d1 migrations apply otakase-accounts --remote

      - name: Deploy
        env:
          DISCORD_CLIENT_ID: ${{ vars.ACCOUNT_DISCORD_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.ACCOUNT_GOOGLE_CLIENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.ACCOUNT_TURNSTILE_SITE_KEY }}
          BOT_URL: ${{ vars.ACCOUNT_BOT_URL }}
        run: |
          args=()
          for name in DISCORD_CLIENT_ID GOOGLE_CLIENT_ID TURNSTILE_SITE_KEY BOT_URL; do
            if [ -n "${!name}" ]; then
              args+=(--var "$name:${!name}")
            fi
          done
          npx wrangler deploy "${args[@]}"
