name: Deploy account Worker

# Tests and deploys the Otakase account Worker (worker/account) to
# Cloudflare. Manual only.
#
# Needs secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit,
# Workers Routes: Edit, DNS: Edit for the account.otakase.com custom domain)
# and CLOUDFLARE_ACCOUNT_ID, plus repository variables ACCOUNT_D1_ID,
# ACCOUNT_DISCORD_CLIENT_ID, ACCOUNT_GOOGLE_CLIENT_ID,
# ACCOUNT_TURNSTILE_SITE_KEY and ACCOUNT_BOT_URL. Worker secrets are set once
# with `wrangler secret put`, never here.

on:
  workflow_dispatch:
    inputs:
      migrate:
        description: Apply new database migrations first
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: account-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worker/account
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/account/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check settings
        env:
          D1_ID: ${{ vars.ACCOUNT_D1_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and the ACCOUNT_D1_ID variable first."
            exit 1
          fi
          sed -i "s/00000000-0000-0000-0000-000000000000/$D1_ID/" wrangler.jsonc

      - name: Apply database migrations
        if: inputs.migrate
        run: npx wrangler d1 migrations apply otakase-accounts --remote

      - name: Deploy
        env:
          DISCORD_CLIENT_ID: ${{ vars.ACCOUNT_DISCORD_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.ACCOUNT_GOOGLE_CLIENT_ID }}
          TURNSTILE_SITE_KEY: ${{ vars.ACCOUNT_TURNSTILE_SITE_KEY }}
          BOT_URL: ${{ vars.ACCOUNT_BOT_URL }}
        run: >-
          npx wrangler deploy
          --var "DISCORD_CLIENT_ID:$DISCORD_CLIENT_ID"
          --var "GOOGLE_CLIENT_ID:$GOOGLE_CLIENT_ID"
          --var "TURNSTILE_SITE_KEY:$TURNSTILE_SITE_KEY"
          --var "BOT_URL:$BOT_URL"
