# Home Assistant add-on for the Discord bot. See wiki/Developer-Discord-Bot.md.
name: Otakase Bot
version: "1.30.51"
slug: otakase_bot
description: Discord bot for the Otakase community server
url: https://github.com/TheXykril/otakase/wiki/Developer-Discord-Bot
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-happy
panel_title: Otakase Bot
# The Otakase Bot dashboard card: the script goes to /config/www and is added
# as a dashboard resource through the Home Assistant API.
homeassistant_api: true
map:
  - type: homeassistant_config
    read_only: false
options:
  token: ""
  guild_id: "1556588123561922560"
  github_client_id: ""
  github_token: ""
  welcome_dm: true
  daily_airing: true
  airing_hour_utc: 6
  ollama_url: "http://76e18fb5-ollama:11434"
  anilist_client_id: ""
  anilist_secret: ""
  public_port: 8100
  warning_days: 90
  season_preview: true
  helper_points: 5
  watch_torrent_max_gib: 4
  watch_torrent_storage_gib: 8
  discord_client_secret: ""
  mal_client_id: ""
  mal_client_secret: ""
schema:
  token: password
  guild_id: str
  github_client_id: str?
  github_token: password?
  welcome_dm: bool
  daily_airing: bool
  airing_hour_utc: int(0,23)
  ollama_url: str?
  anilist_client_id: str?
  anilist_secret: password?
  public_port: port?
  warning_days: int(0,3650)
  season_preview: bool?
  helper_points: int(1,1000)?
  watch_torrent_max_gib: int(1,16)?
  watch_torrent_storage_gib: int(2,32)?
  discord_client_secret: password?
  mal_client_id: str?
  mal_client_secret: password?
