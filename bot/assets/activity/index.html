<!doctype html>
<html lang="en">
<head>

<title>Otakase Activity</title>
<style>
  @font-face { font-family: "Inter"; src: url("fonts/Inter-Medium.otf") format("opentype"); font-weight: 400 500; font-display: swap; }

}
  main.enter > * { animation: rise .3s var(--ease) both; }
