<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · Otakase</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height:100vh; display:grid; place-items:center; padding:24px; background:#0e0d0c; color:#ece4d6; }
    main { width:min(100%,480px); }
    .brand { display:flex; gap:12px; align-items:center; font-weight:700; letter-spacing:.04em; }
    .brand img { width:38px; height:38px; }
    h1 { margin-top:40px; font-size:clamp(28px,7vw,40px); }
    p { color:#b9b0a4; line-height:1.6; }
    button { border:1px solid #d2492f; border-radius:999px; padding:14px 24px; min-height:48px; font:inherit; font-weight:700; background:#d2492f; color:#080707; cursor:pointer; }
    button:focus-visible { outline:2px solid #f28b74; outline-offset:5px; }
  </style>
</head>
<body>
<main>
  <div class="brand"><img src="/img/favicon.svg" alt="">OTAKASE</div>
  <h1 id="heading">Return to your story.</h1>
  <p id="message">Preparing your login.</p>
  <button id="continue" hidden>Open Otakase</button>
</main>
<script src="callback.js"></script>
</body>
</html>
