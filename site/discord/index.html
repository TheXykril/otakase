<head>

<meta name="description" content="Join the otakase Discord server for help, release news and watch parties.">
<meta name="theme-color" content="#0e0d0c">
<meta property="og:title" content="otakase on Discord">
<meta property="og:description" content="Help, release news and watch parties.">

<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">

<!-- Without JavaScript, go straight to the fallback invite. -->
<noscript><meta http-equiv="refresh" content="0; url=https://discord.gg/AfrDAeWbcW"></noscript>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root { --bg: #0e0d0c; --fg: #ece4d6; --accent: #d2492f; --muted: #8a8276; --line: #2a2724; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         font: 12px/1.7 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: 3px; text-transform: uppercase; }
  main { text-align: center; display: grid; gap: 22px; justify-items: center; }
  img { width: 72px; height: 72px; }
  h1 { font: 34px/1.1 'Archivo Black', 'Arial Black', Impact, sans-serif; letter-spacing: 1px; }
  p { color: var(--muted); }
  a.go { color: var(--bg); background: var(--accent); padding: 14px 26px; text-decoration: none; font-weight: 600; }
  a.go:hover { filter: brightness(1.1); }
  a.back { color: var(--muted); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="../img/favicon.svg" alt="">
  <h1>OTAKASE ON DISCORD</h1>
  <p id="msg">Opening the invite…</p>
  <a class="go" id="go" href="https://discord.gg/AfrDAeWbcW">JOIN THE SERVER</a>
  <a class="back" href="../">← otakase.xyverion.com</a>
</main>
<script>
// The server widget hands out a live invite, so this link keeps working even
// if an old invite is removed. The invite below is only the fallback.
(function () {
  var fallback = "https://discord.gg/AfrDAeWbcW";
  var done = false;
  function go(url) {
    if (done) return;
    done = true;
    document.getElementById("go").href = url;
    location.replace(url);
  }
  setTimeout(function () { go(fallback); }, 2500);
  fetch("https://discord.com/api/guilds/1556588123561922560/widget.json")
    .then(function (r) { return r.ok ? r.json() : {}; })
    .then(function (w) { go(w.instant_invite || fallback); })
    .catch(function () { go(fallback); });
})();
</script>
</body>
</html>
